name: Vibelight TV Dev APK (non-publishing)
# Development builds for the UI modernization. This workflow never creates tags,
# releases or prereleases and has read-only repository permissions. APKs are
# uploaded only as workflow artifacts. The beta publication workflow
# (android-tv.yml) is untouched and still only runs on its own beta branch.
on:
  push:
    branches:
      - 'beta/ui-modernization-tv-20261125'
      - 'task/tv-**'
    paths: ['android-tv/**', '.github/workflows/android-tv-dev.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-tv-dev-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            compose: '0'
            flavor: modern
          - abi: x86
            compose: '0'
            flavor: modern
          - abi: x86
            compose: '1'
            flavor: compose-spike
    env:
      VIBELIGHT_TV_ABI: ${{ matrix.abi }}
      # Same identity as the installed Shield beta so later builds update it in place.
      VIBELIGHT_TV_CHANNEL: beta
      VIBELIGHT_TV_COMPOSE: ${{ matrix.compose }}
      VIBELIGHT_TV_PACKAGE: io.github.nyteghost.vibelight.tv.beta
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select Java 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - name: Native-free logic tests
        run: python3 android-tv/tests/run_unit_tests.py
      - name: Fetch pinned Android protocol foundation
        run: |
          git clone --no-checkout https://github.com/moonlight-stream/moonlight-android.git "$RUNNER_TEMP/moonlight-android"
          pin=$(python3 -c 'import json; print(json.load(open("android-tv/upstream.json"))["commit"])')
          git -C "$RUNNER_TEMP/moonlight-android" checkout --detach "$pin"
          git -C "$RUNNER_TEMP/moonlight-android" submodule update --init --recursive
      - name: Prepare isolated Vibelight TV dev source
        run: |
          code=$((20000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          python3 android-tv/prepare.py --upstream "$RUNNER_TEMP/moonlight-android" --output "$RUNNER_TEMP/vibelight-tv" --version-code "$code"
          python3 android-tv/tests/test_prepare.py "$RUNNER_TEMP/vibelight-tv"
      - name: Install pinned Android toolchain
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0' 'ndk;23.2.8568313'
      - name: Restore Gradle caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: vibelight-tv-dev-gradle-${{ matrix.flavor }}-${{ hashFiles('android-tv/upstream.json', 'android-tv/prepare.py') }}
          restore-keys: vibelight-tv-dev-gradle-${{ matrix.flavor }}-
      # Permanent owner key from repository secrets when configured; otherwise a
      # temporary cached test key (which GitHub evicts after 7 idle days).
      - name: Select signing identity
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.VIBELIGHT_TV_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.VIBELIGHT_TV_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p /tmp/vibelight-tv-signing
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > /tmp/vibelight-tv-signing/release.p12
            echo "VIBELIGHT_TV_TEST_KEYSTORE=/tmp/vibelight-tv-signing/release.p12" >> "$GITHUB_ENV"
            echo "kind=permanent" >> "$GITHUB_OUTPUT"
            echo "Signing: permanent owner key (repository secret)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "VIBELIGHT_TV_TEST_KEYSTORE=/tmp/vibelight-tv-signing/temporary-debug.keystore" >> "$GITHUB_ENV"
            echo "kind=temporary" >> "$GITHUB_OUTPUT"
            echo "Signing: TEMPORARY cached test key. Add the VIBELIGHT_TV_KEYSTORE_* secrets for in-place updates that never expire." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Restore temporary test signing key
        if: steps.signing.outputs.kind == 'temporary'
        uses: actions/cache@v4
        with:
          path: /tmp/vibelight-tv-signing/temporary-debug.keystore
          key: vibelight-tv-modern-temporary-key-v1-${{ matrix.abi }}
      - name: Ensure temporary test signing key
        if: steps.signing.outputs.kind == 'temporary'
        run: |
          if [ ! -f "$VIBELIGHT_TV_TEST_KEYSTORE" ]; then
            keytool -genkeypair -keystore "$VIBELIGHT_TV_TEST_KEYSTORE" -storetype JKS -storepass android -keypass android -alias androiddebugkey -dname 'CN=Vibelight TV Beta Test' -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Compile and lint Android APK
        working-directory: ${{ runner.temp }}/vibelight-tv
        env:
          VIBELIGHT_TV_KEYSTORE_PASSWORD: ${{ secrets.VIBELIGHT_TV_KEYSTORE_PASSWORD }}
          VIBELIGHT_TV_KEY_ALIAS: ${{ steps.signing.outputs.kind == 'permanent' && 'vibelight-tv' || '' }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleNonRootDebug lintNonRootDebug
      - name: Package APK, provenance, fingerprint and matching source
        env:
          OUTPUT: ${{ runner.temp }}/tv-output
        run: |
          mkdir -p "$OUTPUT"
          cp "$RUNNER_TEMP/vibelight-tv/app/build/outputs/apk/nonRoot/debug/app-nonRoot-debug.apk" "$OUTPUT/Vibelight-TV-${{ matrix.abi }}-${{ matrix.flavor }}.apk"
          cp "$RUNNER_TEMP/vibelight-tv/vibelight-build.json" "$OUTPUT/"
          cp android-tv/docs/DEV_BUILDS.md "$OUTPUT/INSTALL.md"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$OUTPUT/"*.apk > "$OUTPUT/signing-certificate.txt"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$OUTPUT/"*.apk > "$OUTPUT/apk-badging.txt"
          tar --exclude='./.gradle' --exclude='./.cxx' --exclude='*/build' -czf "$OUTPUT/matching-android-source.tar.gz" -C "$RUNNER_TEMP/vibelight-tv" .
          cd "$OUTPUT"
          sha256sum ./*.apk ./matching-android-source.tar.gz > SHA256SUMS
          ls -l ./*.apk | tee -a "$GITHUB_STEP_SUMMARY"
          grep 'certificate SHA-256' signing-certificate.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload dev APK (workflow artifact only)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Vibelight-TV-${{ matrix.abi }}-${{ matrix.flavor }}-${{ steps.signing.outputs.kind }}-key-${{ github.run_number }}
          path: ${{ runner.temp }}/tv-output/
          if-no-files-found: error
      - name: Allow emulator KVM
        if: matrix.abi == 'x86'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator UI, navigation and screenshot checks
        if: matrix.abi == 'x86'
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 30
          target: android-tv
          profile: tv_1080p
          arch: x86
          disable-animations: true
          script: python3 android-tv/tests/emulator_dev.py "${{ runner.temp }}/tv-output/Vibelight-TV-x86-${{ matrix.flavor }}.apk" "${{ runner.temp }}/tv-smoke" "${{ matrix.flavor }}"
      - name: Remove decoded signing material
        if: always()
        run: rm -rf /tmp/vibelight-tv-signing
      - name: Upload emulator evidence and lint report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Vibelight-TV-evidence-${{ matrix.abi }}-${{ matrix.flavor }}-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/tv-smoke/
            ${{ runner.temp }}/vibelight-tv/app/build/reports/lint-results-nonRootDebug.*
          if-no-files-found: ignore
